# Laptop (nixos-btw): single built-in panel. The old DP-2/DP-3/HDMI-A-1 blocks
# were the desktop's and are gone.
#
# This file only seeds the wallpaper at hyprpaper startup -- pick-wallpaper
# sets wallpapers at runtime over IPC and never reads this file, so `ipc = true`
# is load-bearing.
wallpaper {
  monitor = eDP-1
  path = ~/Pictures/wallpaper/favorites/wallpaper.jpg
  fit_mode = cover
}

splash = false
ipc = true
